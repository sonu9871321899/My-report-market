<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordUp — Professional Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#0a0c10; color:#e8eaf0; font-family:'DM Sans',sans-serif; min-height:100vh; padding:20px 14px 60px; }
  header { text-align:center; margin-bottom:18px; }
  header h1 { font-family:'Playfair Display',serif; font-size:2.4rem; font-weight:900; color:#e8eaf0; letter-spacing:-1px; }
  header h1 span { color:#f0c040; }
  header p { color:#6a7080; font-size:0.78rem; margin-top:5px; letter-spacing:2px; text-transform:uppercase; }

  .tab-row { display:flex; gap:6px; justify-content:center; margin-bottom:20px; }
  .tab { padding:7px 18px; border-radius:999px; border:1.5px solid #222830; background:transparent; color:#6a7080; font-family:'DM Sans',sans-serif; font-size:0.82rem; cursor:pointer; transition:all 0.2s; }
  .tab.active { background:#181d26; color:#e8eaf0; border-color:#303848; font-weight:500; }

  .tab-content { display:none; }
  .tab-content.visible { display:block; }

  .load-btn { display:block; margin:0 auto 24px; background:linear-gradient(135deg,#e0e4f0,#b0b8d0); color:#08090c; border:none; border-radius:14px; padding:13px 34px; font-family:'DM Sans',sans-serif; font-size:0.95rem; font-weight:500; cursor:pointer; transition:transform 0.15s,opacity 0.2s; }
  .load-btn:hover { transform:scale(1.03); }
  .load-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }

  .words-grid { display:flex; flex-direction:column; gap:18px; max-width:660px; margin:0 auto; }

  .word-card { background:#12151c; border-radius:16px; padding:22px 22px 18px; border:1px solid #1a1f2a; animation:fadeUp 0.4s ease both; position:relative; overflow:hidden; }
  .word-card:nth-child(2) { animation-delay:0.1s; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

  .card-stripe { position:absolute; top:0; left:0; width:100%; height:3px; }
  .word-top { display:flex; align-items:center; gap:9px; margin-bottom:4px; flex-wrap:wrap; }
  .word-eng { font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; line-height:1.1; }
  .word-type { font-size:0.7rem; color:#6a7080; background:#1e2330; padding:2px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:0.5px; }
  .prof-tag { font-size:0.7rem; padding:2px 9px; border-radius:999px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
  .word-hindi { font-size:1.1rem; font-weight:500; margin-bottom:14px; opacity:0.85; }
  .sec-label { font-size:0.68rem; text-transform:uppercase; letter-spacing:1.5px; color:#6a7080; margin-bottom:5px; margin-top:14px; }
  .word-simple { font-size:0.95rem; color:#c0c8d8; line-height:1.6; }
  .word-detail { font-size:0.88rem; color:#8090a8; line-height:1.7; }
  .word-example { font-size:0.85rem; color:#6a7080; font-style:italic; border-left:3px solid #222a38; padding-left:12px; margin-top:12px; line-height:1.6; }
  .word-tip { margin-top:12px; font-size:0.82rem; background:#151a24; border-radius:10px; padding:10px 14px; color:#7888a8; line-height:1.6; }

  .search-wrap { max-width:600px; margin:0 auto; }
  .chips-label { font-size:0.72rem; text-transform:uppercase; letter-spacing:1.5px; color:#6a7080; margin-bottom:10px; }
  .chips-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
  .chip { padding:5px 13px; border-radius:999px; border:1px solid #1e2530; background:#12151c; color:#7080a0; font-size:0.78rem; cursor:pointer; transition:all 0.15s; }
  .chip:hover { border-color:#4060a0; color:#a0b8e0; }

  .search-row { display:flex; gap:8px; margin-bottom:20px; }
  .search-input { flex:1; background:#12151c; border:1.5px solid #1e2530; border-radius:14px; padding:12px 16px; color:#e8eaf0; font-family:'DM Sans',sans-serif; font-size:0.95rem; outline:none; transition:border-color 0.2s; }
  .search-input:focus { border-color:#4060a0; }
  .search-input::placeholder { color:#6a7080; }
  .search-btn { background:#1e2530; color:#e8eaf0; border:1.5px solid #303848; border-radius:14px; padding:12px 20px; font-family:'DM Sans',sans-serif; font-size:0.9rem; cursor:pointer; transition:background 0.15s; white-space:nowrap; }
  .search-btn:hover { background:#263040; }
  .search-btn:disabled { opacity:0.45; cursor:not-allowed; }

  .quiz-wrap { max-width:560px; margin:0 auto; }
  .quiz-box { background:#12151c; border-radius:16px; padding:26px 22px; border:1px solid #1a1f2a; animation:fadeUp 0.3s ease; }
  .quiz-prog { font-size:0.75rem; color:#6a7080; text-align:right; margin-bottom:14px; letter-spacing:1px; }
  .quiz-q { font-size:0.8rem; color:#6a7080; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .quiz-word { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; margin-bottom:20px; line-height:1.2; }
  .options-col { display:flex; flex-direction:column; gap:8px; }
  .opt-btn { background:#181d26; border:1.5px solid #1e2530; border-radius:11px; padding:12px 15px; color:#e8eaf0; font-family:'DM Sans',sans-serif; font-size:0.88rem; cursor:pointer; transition:all 0.15s; text-align:left; line-height:1.4; }
  .opt-btn:hover:not(:disabled) { border-color:#4060a0; background:#1a2030; }
  .opt-btn.correct { background:rgba(76,175,125,0.13); border-color:#4caf7d; color:#4caf7d; }
  .opt-btn.wrong   { background:rgba(224,85,85,0.1);   border-color:#e05555; color:#e05555; }
  .next-btn { display:block; margin:16px auto 0; background:#181d26; border:1.5px solid #2a3040; border-radius:999px; padding:9px 28px; color:#e8eaf0; font-family:'DM Sans',sans-serif; font-size:0.88rem; cursor:pointer; }
  .next-btn:hover { border-color:#5070b0; }

  .score-box { text-align:center; padding:36px 24px; background:#12151c; border-radius:16px; border:1px solid #1a1f2a; animation:fadeUp 0.3s ease; }
  .score-big { font-family:'Playfair Display',serif; font-size:4.5rem; font-weight:900; line-height:1; color:#f0c040; }
  .score-label { color:#6a7080; font-size:0.8rem; margin-top:6px; letter-spacing:1px; text-transform:uppercase; }
  .score-msg { margin-top:14px; font-size:1rem; color:#a0aac0; line-height:1.6; }
  .retry-btn { display:inline-block; margin-top:22px; background:#1e2530; border:1.5px solid #303848; border-radius:999px; padding:10px 28px; color:#e8eaf0; font-family:'DM Sans',sans-serif; font-size:0.9rem; cursor:pointer; }
  .retry-btn:hover { background:#263040; }

  .loading-txt { text-align:center; color:#6a7080; font-size:0.88rem; padding:30px; }
  .error-txt   { text-align:center; color:#e05555; font-size:0.88rem; padding:20px; }
  .empty-msg   { text-align:center; color:#6a7080; padding:28px; font-size:0.9rem; line-height:1.7; }
</style>
</head>
<body>

<header>
  <h1>Word<span>Up</span></h1>
  <p>Professional Vocabulary · Hindi Explanation · Daily 2 Words</p>
</header>

<div class="tab-row">
  <button class="tab active" onclick="switchTab('learn')">📖 सीखो</button>
  <button class="tab" onclick="switchTab('search')">🔍 Explain</button>
  <button class="tab" onclick="switchTab('quiz')">🧠 Quiz</button>
</div>

<div id="learn-tab" class="tab-content visible">
  <button class="load-btn" id="load-btn" onclick="loadWords()">🎲 Random 2 Words लाओ</button>
  <div class="words-grid" id="words-container"></div>
</div>

<div id="search-tab" class="tab-content">
  <div class="search-wrap">
    <div class="chips-label">Quick Search</div>
    <div class="chips-row" id="chips-row"></div>
    <div class="search-row">
      <input type="text" class="search-input" id="search-input"
        placeholder="कोई भी term — EPS, NPA, Triage, Agile..."
        onkeydown="if(event.key==='Enter') doSearch()" />
      <button class="search-btn" id="search-btn" onclick="doSearch()">Explain करो</button>
    </div>
    <div id="search-result"></div>
  </div>
</div>

<div id="quiz-tab" class="tab-content">
  <div class="quiz-wrap" id="quiz-wrap">
    <div class="empty-msg">पहले <strong style="color:#a0b0d0">सीखो</strong> tab में words load करो 🎯</div>
  </div>
</div>

<script>
const PROF = {
  finance:    { icon:'📈', label:'Finance',    color:'#f0c040' },
  medical:    { icon:'🏥', label:'Medical',    color:'#5fd4a0' },
  legal:      { icon:'⚖️',  label:'Legal',      color:'#a07adf' },
  tech:       { icon:'💻', label:'IT/Tech',    color:'#5ba8e0' },
  hr:         { icon:'👥', label:'HR',         color:'#f08060' },
  marketing:  { icon:'📣', label:'Marketing',  color:'#e060b0' },
  banking:    { icon:'🏦', label:'Banking',    color:'#60d0e0' },
  govt:       { icon:'🏛️',  label:'Govt/IAS',  color:'#a0c060' },
  accounting: { icon:'📒', label:'Accounting', color:'#80d080' },
  english:    { icon:'🔤', label:'English',    color:'#c0a060' },
};
const getColor = c => (PROF[c]||{color:'#a0aac0'}).color;
const getLabel = c => { const p=PROF[c]; return p ? p.icon+' '+p.label : c; };

const LEARN_PROMPT = `You are a professional vocabulary teacher for Indian learners. Return ONLY a valid JSON array of exactly 2 objects — no markdown, no explanation, just the raw JSON array starting with [ and ending with ].

Pick 2 words randomly from DIFFERENT professions: Finance, Medical, Legal, IT/Tech, HR, Marketing, Banking, Govt/IAS, Accounting, or General English.

Each object keys:
- "word": English term
- "type": Hindi type label (e.g. "वित्तीय अनुपात", "चिकित्सा शब्द", "कानूनी शब्द")
- "category": one of: finance, medical, legal, tech, hr, marketing, banking, govt, accounting, english
- "hindi": 2-5 word Hindi meaning in Devanagari
- "simple_meaning": 1 clear sentence in ENGLISH explaining what the word means
- "detail": 4-5 sentences in Hindi (Devanagari) — full explanation, formula if any, Indian context, practical importance
- "example": 1-2 sentences in Hindi with Indian company/hospital/court name
- "tip": 1 sentence in Hindi — memory trick or common mistake`;

const SEARCH_PROMPT = `You are a professional vocabulary teacher for Indian learners. Return ONLY a valid JSON object — no markdown, no explanation, just raw JSON starting with { and ending with }.

Keys:
- "word": the English term
- "type": Hindi type label
- "category": one of: finance, medical, legal, tech, hr, marketing, banking, govt, accounting, english
- "hindi": 2-5 word Hindi meaning in Devanagari
- "simple_meaning": 1 clear sentence in ENGLISH explaining what the word means
- "detail": 4-5 sentences in Hindi (Devanagari) with full explanation, Indian context, formula if any
- "example": 1-2 sentences in Hindi with Indian scenario
- "tip": 1 sentence in Hindi
- "related": array of 3 related English term strings`;

let wordsData=[], quizIdx=0, quizScore=0, quizWords=[];

// chips
const CHIPS = ['EPS','Stagflation','Prognosis','Affidavit','API','Attrition','ROI','NPA','GDP','Depreciation','Triage','Injunction','Agile','Appraisal','CTR','Repo Rate','Fiscal Deficit','Balance Sheet','Articulate','EBITDA'];
document.getElementById('chips-row').innerHTML = CHIPS.map(c=>`<span class="chip" onclick="quickSearch('${c}')">${c}</span>`).join('');

function switchTab(t) {
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('visible'));
  document.getElementById(t+'-tab').classList.add('visible');
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['learn','search','quiz'][i]===t));
  if(t==='quiz') setupQuiz();
}

async function callAPI(system, userMsg, maxTokens) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens: maxTokens||1400,
      system: system,
      messages:[{role:'user', content: userMsg}]
    })
  });
  const data = await res.json();
  const text = (data.content||[]).find(c=>c.type==='text')?.text || '';
  return text.trim().replace(/```json|```/g,'').trim();
}

async function loadWords() {
  const btn = document.getElementById('load-btn');
  const box = document.getElementById('words-container');
  btn.disabled=true; btn.textContent='⏳ Loading...';
  box.innerHTML='<div class="loading-txt">AI random words generate कर रहा है...</div>';
  try {
    const raw = await callAPI(LEARN_PROMPT, 'Give me 2 random words from different professions. Return only the JSON array.');
    wordsData = JSON.parse(raw);
    renderWords(wordsData);
    btn.textContent='🎲 2 और Random Words';
  } catch(e) {
    box.innerHTML='<div class="error-txt">कुछ गड़बड़ हो गई। दोबारा try करो।</div>';
    btn.textContent='🎲 Random 2 Words लाओ';
  }
  btn.disabled=false;
}

function cardHTML(w, extraStyle='') {
  const col = getColor(w.category);
  return `
  <div class="word-card" ${extraStyle}>
    <div class="card-stripe" style="background:${col}"></div>
    <div class="word-top">
      <span class="word-eng" style="color:${col}">${w.word}</span>
      <span class="word-type">${w.type||''}</span>
      <span class="prof-tag" style="background:${col}22;color:${col}">${getLabel(w.category)}</span>
    </div>
    <div class="word-hindi" style="color:${col}bb">${w.hindi}</div>
    <div class="sec-label">सरल अर्थ</div>
    <div class="word-simple">${w.simple_meaning}</div>
    <div class="sec-label">पूरी जानकारी</div>
    <div class="word-detail">${w.detail}</div>
    <div class="word-example">${w.example}</div>
    ${w.tip?`<div class="word-tip">💡 ${w.tip}</div>`:''}
  </div>`;
}

function renderWords(words) {
  document.getElementById('words-container').innerHTML = words.map(w=>cardHTML(w)).join('');
}

function quickSearch(term) {
  document.getElementById('search-input').value=term;
  switchTab('search');
  doSearch();
}

async function doSearch() {
  const val = document.getElementById('search-input').value.trim();
  if(!val) return;
  const btn = document.getElementById('search-btn');
  const box = document.getElementById('search-result');
  btn.disabled=true; btn.textContent='⏳...';
  box.innerHTML='<div class="loading-txt">Explaining कर रहा हूँ...</div>';
  try {
    const raw = await callAPI(SEARCH_PROMPT, `Explain: "${val}"`, 1000);
    const w = JSON.parse(raw);
    const col = getColor(w.category);
    box.innerHTML = cardHTML(w) + `
      <div style="max-width:660px;margin:0 auto">
        <div class="sec-label" style="margin-top:16px;padding-left:4px">संबंधित शब्द</div>
        <div class="chips-row" style="margin-top:8px">
          ${(w.related||[]).map(r=>`<span class="chip" onclick="quickSearch('${r}')">${r}</span>`).join('')}
        </div>
      </div>`;
  } catch(e) {
    box.innerHTML='<div class="error-txt">कुछ गड़बड़ हो गई। दोबारा try करो।</div>';
  }
  btn.disabled=false; btn.textContent='Explain करो';
}

function setupQuiz() {
  const wrap = document.getElementById('quiz-wrap');
  if(wordsData.length < 2) {
    wrap.innerHTML='<div class="empty-msg">पहले <strong style="color:#a0b0d0">सीखो</strong> tab में words load करो 🎯</div>';
    return;
  }
  quizWords=[...wordsData].sort(()=>Math.random()-0.5);
  quizIdx=0; quizScore=0;
  showQ();
}

function showQ() {
  const wrap = document.getElementById('quiz-wrap');
  if(quizIdx>=quizWords.length){showScore();return;}
  const cur = quizWords[quizIdx];
  const wrong = wordsData.filter(w=>w.word!==cur.word).sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [...wrong,cur].sort(()=>Math.random()-0.5);
  const col = getColor(cur.category);
  wrap.innerHTML=`
    <div class="quiz-box">
      <div class="quiz-prog">WORD ${quizIdx+1} / ${quizWords.length}</div>
      <div class="quiz-q">इस term का Hindi meaning क्या है?</div>
      <div class="quiz-word" style="color:${col}">${cur.word}</div>
      <div class="options-col" id="opts">
        ${opts.map((o,i)=>`<button class="opt-btn" onclick="checkA(this,'${o.word.replace(/'/g,"\\'")}','${cur.word.replace(/'/g,"\\'")}','${cur.hindi.replace(/'/g,"\\'")}')">
          ${o.hindi}
        </button>`).join('')}
      </div>
    </div>`;
}

function checkA(btn, sel, correct, correctHindi) {
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(sel===correct){ btn.classList.add('correct'); quizScore++; }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{
      if(b.textContent.trim()===correctHindi) b.classList.add('correct');
    });
  }
  const nb=document.createElement('button');
  nb.className='next-btn';
  nb.textContent=quizIdx+1<quizWords.length?'अगला →':'Result देखो 🏆';
  nb.onclick=()=>{quizIdx++;showQ();};
  document.querySelector('.quiz-box').appendChild(nb);
}

function showScore() {
  const pct=Math.round(quizScore/quizWords.length*100);
  const msg=pct===100?'🔥 Perfect! दोनों याद हो गए!':pct>=50?'👍 अच्छा किया! एक बार और पढ़ो।':'📚 दोबारा सीखो tab में पढ़ो।';
  document.getElementById('quiz-wrap').innerHTML=`
    <div class="score-box">
      <div class="score-big">${quizScore}/${quizWords.length}</div>
      <div class="score-label">सही जवाब</div>
      <div class="score-msg">${msg}</div>
      <button class="retry-btn" onclick="setupQuiz()">🔄 फिर से Quiz दो</button>
    </div>`;
}
</script>
</body>
</html>
